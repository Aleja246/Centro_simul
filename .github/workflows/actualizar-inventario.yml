# Cuando se sube un Excel a la carpeta datos/, lo convierte en datos/inventario.json
# y regenera los QR de qr/equipos/. La página equipo/ se actualiza sola al publicarse.
name: Actualizar inventario

on:
  push:
    branches: [main]
    paths: ["datos/*.xlsx"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-inventario
  cancel-in-progress: false

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install openpyxl "qrcode[pil]"

      - name: Elegir el Excel recién subido y dejarlo como datos/inventario.xlsx
        run: |
          nuevo=$(git diff --name-only HEAD~1 HEAD -- 'datos/*.xlsx' 2>/dev/null | head -n 1)
          [ -n "$nuevo" ] && [ -f "$nuevo" ] || nuevo=datos/inventario.xlsx
          if [ ! -f "$nuevo" ]; then echo "No hay ningún Excel en datos/"; exit 1; fi
          if [ "$nuevo" != "datos/inventario.xlsx" ]; then git mv -f "$nuevo" datos/inventario.xlsx; fi
          # Solo se guarda un Excel: se borran otros que hayan quedado con otro nombre.
          find datos -maxdepth 1 -name '*.xlsx' ! -name 'inventario.xlsx' -exec git rm -q {} \;

      - name: Convertir a JSON y generar QR
        run: python3 scripts/excel_a_json.py datos/inventario.xlsx | tee resumen.txt

      - name: Pruebas
        run: node --test

      - name: Guardar cambios
        run: |
          git config user.name "Actualizar inventario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos qr/equipos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Inventario actualizado desde Excel" -m "$(head -n 30 resumen.txt)"
          git push

      - name: Publicar en GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null && echo "Publicación solicitada"

      - name: Resumen
        if: always()
        run: |
          echo "### Inventario" >> "$GITHUB_STEP_SUMMARY"
          [ -f resumen.txt ] && sed 's/^/    /' resumen.txt >> "$GITHUB_STEP_SUMMARY" || true
